<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mosca Taller · v1.0 · 2026-06-01</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #282828;
      --text: #f0f0f0;
      --muted: #777;
      --accent: #e8a020;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .version {
      font-size: 11px;
      color: var(--muted);
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
    }

    .btn-icon:active { opacity: 0.5; }

    #main {
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-box {
      background: #2a0f0f;
      border: 1px solid #7a2020;
      border-radius: 10px;
      padding: 16px;
      margin: 16px 0;
      font-size: 13px;
      color: #ff8080;
    }

    /* ── Token prompt ── */
    .token-screen {
      padding: 60px 20px 20px;
      text-align: center;
    }

    .token-screen h2 {
      font-size: 20px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .token-screen p {
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Pedido card ── */
    .pedido-group {
      margin-bottom: 14px;
    }

    .pedido-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pid {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pedido-meta {
      flex: 1;
      min-width: 0;
    }

    .pedido-cliente {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pedido-fecha {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .pedido-fecha.atrasado { color: #ff6060; font-weight: 600; }
    .pedido-fecha.hoy      { color: #ff9030; font-weight: 600; }
    .pedido-fecha.pronto   { color: #f0b040; }

    .ec-badge {
      flex-shrink: 0;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #222;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Items ── */
    .items-list {
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      overflow: hidden;
    }

    .item {
      background: var(--bg);
      padding: 11px 13px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .item:active { background: #141414; }

    .item-nr {
      font-size: 11px;
      color: var(--muted);
      width: 18px;
      flex-shrink: 0;
      text-align: right;
    }

    .item-body {
      flex: 1;
      min-width: 0;
    }

    .item-desc {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-dims {
      font-size: 12px;
      color: var(--muted);
    }

    .item-nota {
      font-size: 11px;
      color: #c09040;
      margin-top: 2px;
    }

    /* ── Estado badges ── */
    .ebadge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      max-width: 110px;
      text-align: center;
      word-break: break-word;
    }

    .eb-Nuevo          { background: #242424; color: #999; }
    .eb-En_herreria    { background: #2e1800; color: #f0a050; }
    .eb-En_carpinteria { background: #00102e; color: #5080d0; }
    .eb-En_pintura     { background: #1e0030; color: #b070e0; }
    .eb-Para_entregar  { background: #002a10; color: #40b060; }
    .eb-Entregado      { background: #0f1f0f; color: #509050; }
    .eb-En_Stock       { background: #002828; color: #30b0b0; }
    .eb-Vendido        { background: #1e1e00; color: #b0b030; }
    .eb-Rehacer        { background: #2e0000; color: #f05050; }
    .eb-Cancelado      { background: #181818; color: #444; }

    /* ── Empty ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    }

    .drag-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .modal-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .estado-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 10px;
    }

    .ebtn {
      padding: 13px 8px;
      border: 2px solid var(--border);
      border-radius: 9px;
      background: #121212;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.1s;
    }

    .ebtn:active { opacity: 0.6; }

    .ebtn.current {
      border-color: var(--accent);
      background: #221500;
      color: var(--accent);
    }

    .ebtn.saving {
      opacity: 0.4;
      pointer-events: none;
    }

    .btn-cancel {
      display: block;
      width: 100%;
      padding: 13px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
    }

    .btn-cancel:active { opacity: 0.6; }

  </style>
</head>
<body>

<header>
  <h1>Mosca Taller</h1>
  <div class="header-right">
    <span class="version">v1.0 · 2026-06-01</span>
    <button class="btn-icon" onclick="loadData()" title="Actualizar">↻</button>
  </div>
</header>

<div id="main">
  <div class="loading">
    <div class="spinner"></div>
    <div>Cargando...</div>
  </div>
</div>

<!-- Modal cambio de estado -->
<div class="overlay hidden" id="overlay" onclick="onOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="drag-handle"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="estado-grid" id="estado-grid"></div>
    <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<script>
  'use strict';

  // ── Config ──────────────────────────────────────────────
  const BASE     = 'appBThGsxqCSljqH1';
  const T_ITEMS  = 'tblQ4Kq61LlZHFPNN';
  const T_PEDIDO = 'tblok3VLqWA3oQaPe';
  const T_CLIENT = 'tbl5tU70DznAaqNd6';
  const API      = 'https://api.airtable.com/v0';

  const ESTADOS = [
    'Nuevo',
    'En herrería',
    'En carpintería',
    'En pintura',
    'Para entregar',
    'Entregado',
    'Rehacer',
    'Cancelado',
  ];

  // ── State ────────────────────────────────────────────────
  let TOKEN       = null;
  let items       = [];   // array of {id, nro_linea, descripcion, dimensiones, estado, notas_taller, pedidoId}
  let pedidosMap  = {};   // recId → {id_pedido, clienteNombre, fechaEntrega, estado_comercial}
  let activeItem  = null; // item being edited

  // ── Init ─────────────────────────────────────────────────
  TOKEN = new URLSearchParams(window.location.search).get('token');

  if (!TOKEN) {
    document.getElementById('main').innerHTML = `
      <div class="token-screen">
        <h2>Mosca Taller</h2>
        <p>Pedile el link a Lisandro para acceder.</p>
      </div>`;
  } else {
    loadData();
  }

  // ── API helpers ──────────────────────────────────────────
  async function apiFetch(tableId, params) {
    const url = new URL(`${API}/${BASE}/${tableId}`);
    for (const [k, v] of Object.entries(params)) {
      if (Array.isArray(v)) {
        v.forEach(x => url.searchParams.append(k, x));
      } else if (v !== undefined) {
        url.searchParams.set(k, v);
      }
    }
    const r = await fetch(url.toString(), {
      headers: { Authorization: `Bearer ${TOKEN}` }
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    return r.json();
  }

  async function apiPatch(tableId, recId, fields) {
    const r = await fetch(`${API}/${BASE}/${tableId}/${recId}`, {
      method: 'PATCH',
      headers: {
        Authorization: `Bearer ${TOKEN}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ fields }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    return r.json();
  }

  async function fetchAll(tableId, params) {
    let recs = [], offset;
    do {
      const p = { ...params };
      if (offset) p.offset = offset;
      const data = await apiFetch(tableId, p);
      recs = recs.concat(data.records || []);
      offset = data.offset;
    } while (offset);
    return recs;
  }

  // ── Load data ────────────────────────────────────────────
  async function loadData() {
    setMain(`<div class="loading"><div class="spinner"></div><div>Cargando...</div></div>`);

    try {
      // 1. Items activos (excluir Cancelado y Vendido)
      const rawItems = await fetchAll(T_ITEMS, {
        filterByFormula: `AND(NOT({estado}='Cancelado'),NOT({estado}='Vendido'))`,
        'fields[]': ['nro_linea','descripcion','dimensiones','estado','notas_taller','pedido'],
      });

      // 2. IDs únicos de pedidos
      const pidSet = new Set(rawItems.flatMap(r => r.fields.pedido || []));
      const pidArr = [...pidSet];

      if (!pidArr.length) {
        setMain(`<div class="empty">No hay items activos</div>`);
        return;
      }

      // 3. Pedidos_v2
      const pedFilter = pidArr.length === 1
        ? `RECORD_ID()='${pidArr[0]}'`
        : `OR(${pidArr.map(id => `RECORD_ID()='${id}'`).join(',')})`;

      const rawPedidos = await fetchAll(T_PEDIDO, {
        filterByFormula: pedFilter,
        'fields[]': ['id_pedido','fecha_seña','dias_adicionales','estado_comercial','cliente'],
      });

      // 4. IDs únicos de clientes
      const cidSet = new Set(rawPedidos.flatMap(r => r.fields.cliente || []));
      const cidArr = [...cidSet];

      // 5. Clientes
      let rawClientes = [];
      if (cidArr.length) {
        const cFilter = cidArr.length === 1
          ? `RECORD_ID()='${cidArr[0]}'`
          : `OR(${cidArr.map(id => `RECORD_ID()='${id}'`).join(',')})`;
        rawClientes = await fetchAll(T_CLIENT, {
          filterByFormula: cFilter,
          'fields[]': ['nombre','telefono'],
        });
      }

      // Build maps
      const clienteMap = {};
      rawClientes.forEach(r => { clienteMap[r.id] = r.fields; });

      pedidosMap = {};
      rawPedidos.forEach(r => {
        const cid     = (r.fields.cliente || [])[0];
        const cli     = cid ? clienteMap[cid] : null;
        const fechaSena   = r.fields['fecha_seña'];
        const diasExtra   = r.fields.dias_adicionales || 0;
        let   fechaEntrega = null;
        if (fechaSena) {
          const d = new Date(fechaSena + 'T00:00:00');
          d.setDate(d.getDate() + 30 + diasExtra);
          fechaEntrega = d;
        }
        pedidosMap[r.id] = {
          recId:          r.id,
          id_pedido:      r.fields.id_pedido,
          estado_comercial: r.fields.estado_comercial || '',
          clienteNombre:  cli ? (cli.nombre || cli.telefono || 'Sin nombre') : 'Sin cliente',
          fechaEntrega,
        };
      });

      items = rawItems.map(r => ({
        id:          r.id,
        nro_linea:   r.fields.nro_linea || 0,
        descripcion: r.fields.descripcion || 'Sin descripción',
        dimensiones: r.fields.dimensiones || '',
        estado:      r.fields.estado || 'Nuevo',
        notas_taller: r.fields.notas_taller || '',
        pedidoId:    (r.fields.pedido || [])[0] || null,
      }));

      render();

    } catch (err) {
      setMain(`<div class="error-box"><strong>Error al cargar datos</strong><br><br>${err.message}</div>`);
      console.error(err);
    }
  }

  // ── Render ───────────────────────────────────────────────
  function render() {
    // Group items by pedido
    const groups = {};
    items.forEach(item => {
      if (!item.pedidoId || !pedidosMap[item.pedidoId]) return;
      if (!groups[item.pedidoId]) groups[item.pedidoId] = [];
      groups[item.pedidoId].push(item);
    });

    // Sort pedidos by fechaEntrega ASC (null al final)
    const pedidosSorted = Object.keys(groups).sort((a, b) => {
      const fa = pedidosMap[a].fechaEntrega;
      const fb = pedidosMap[b].fechaEntrega;
      if (fa && fb) return fa - fb;
      return fa ? -1 : fb ? 1 : 0;
    });

    if (!pedidosSorted.length) {
      setMain(`<div class="empty">No hay items activos</div>`);
      return;
    }

    const html = pedidosSorted.map(pid => renderPedido(pid, groups[pid])).join('');
    setMain(html);
  }

  function renderPedido(pid, itemsGrupo) {
    const p    = pedidosMap[pid];
    const dias = diasHasta(p.fechaEntrega);

    let fechaClass = '';
    let fechaLabel = '';
    if (p.fechaEntrega) {
      const label = p.fechaEntrega.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
      if (dias < 0)      { fechaClass = 'atrasado'; fechaLabel = `Atrasado · ${label} (${Math.abs(dias)}d)`; }
      else if (dias === 0){ fechaClass = 'hoy';      fechaLabel = `Hoy · ${label}`; }
      else if (dias === 1){ fechaClass = 'hoy';      fechaLabel = `Mañana · ${label}`; }
      else if (dias <= 4) { fechaClass = 'pronto';   fechaLabel = `${label} · ${dias}d`; }
      else                {                           fechaLabel = `${label} · ${dias}d`; }
    } else {
      fechaLabel = 'Sin fecha de entrega';
    }

    const itemsSorted = [...itemsGrupo].sort((a, b) => a.nro_linea - b.nro_linea);

    return `
      <div class="pedido-group">
        <div class="pedido-header">
          <div class="pid">#${p.id_pedido ?? '?'}</div>
          <div class="pedido-meta">
            <div class="pedido-cliente">${esc(p.clienteNombre)}</div>
            <div class="pedido-fecha ${fechaClass}">${fechaLabel}</div>
          </div>
          ${p.estado_comercial ? `<div class="ec-badge">${esc(p.estado_comercial)}</div>` : ''}
        </div>
        <div class="items-list">
          ${itemsSorted.map(item => renderItem(item)).join('')}
        </div>
      </div>`;
  }

  function renderItem(item) {
    const ec = estadoClass(item.estado);
    return `
      <div class="item" onclick="openModal('${item.id}')">
        <div class="item-nr">${item.nro_linea || '·'}</div>
        <div class="item-body">
          <div class="item-desc">${esc(item.descripcion)}</div>
          ${item.dimensiones ? `<div class="item-dims">${esc(item.dimensiones)}</div>` : ''}
          ${item.notas_taller ? `<div class="item-nota">⚠ ${esc(item.notas_taller)}</div>` : ''}
        </div>
        <div class="ebadge ${ec}">${esc(item.estado)}</div>
      </div>`;
  }

  // ── Modal ────────────────────────────────────────────────
  function openModal(itemId) {
    activeItem = items.find(i => i.id === itemId);
    if (!activeItem) return;

    const p = pedidosMap[activeItem.pedidoId] || {};

    document.getElementById('modal-title').textContent = activeItem.descripcion;
    document.getElementById('modal-sub').textContent =
      `#${p.id_pedido ?? '?'} · ${p.clienteNombre ?? ''}`;

    document.getElementById('estado-grid').innerHTML = ESTADOS.map(e => `
      <button class="ebtn ${e === activeItem.estado ? 'current' : ''}"
              onclick="selectEstado('${e}')">
        ${esc(e)}
      </button>`).join('');

    document.getElementById('overlay').classList.remove('hidden');
  }

  async function selectEstado(nuevoEstado) {
    if (!activeItem || nuevoEstado === activeItem.estado) {
      closeModal();
      return;
    }

    // Disable buttons
    document.querySelectorAll('.ebtn').forEach(b => b.classList.add('saving'));

    const prevEstado  = activeItem.estado;
    activeItem.estado = nuevoEstado; // optimistic update

    try {
      await apiPatch(T_ITEMS, activeItem.id, { estado: nuevoEstado });
      closeModal();
      render();
    } catch (err) {
      activeItem.estado = prevEstado; // rollback
      alert('No se pudo guardar: ' + err.message);
      document.querySelectorAll('.ebtn').forEach(b => b.classList.remove('saving'));
    }
  }

  function closeModal() {
    document.getElementById('overlay').classList.add('hidden');
    activeItem = null;
  }

  function onOverlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  // ── Helpers ──────────────────────────────────────────────
  function setMain(html) {
    document.getElementById('main').innerHTML = html;
  }

  function diasHasta(fecha) {
    if (!fecha) return null;
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const d   = new Date(fecha); d.setHours(0,0,0,0);
    return Math.round((d - hoy) / 86400000);
  }

  function estadoClass(e) {
    // Maps estado string → CSS class key
    const map = {
      'Nuevo':           'eb-Nuevo',
      'En herrería':     'eb-En_herreria',
      'En carpintería':  'eb-En_carpinteria',
      'En pintura':      'eb-En_pintura',
      'Para entregar':   'eb-Para_entregar',
      'Entregado':       'eb-Entregado',
      'En Stock':        'eb-En_Stock',
      'Vendido':         'eb-Vendido',
      'Rehacer':         'eb-Rehacer',
      'Cancelado':       'eb-Cancelado',
    };
    return map[e] || 'eb-Nuevo';
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
